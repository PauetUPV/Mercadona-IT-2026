const listaPlatos = Object.values(platos).sort((a, b) => b.si / (b.si + b.no) - a.si / (a.si + a.no));

const tipos = contar(COMENTARIOS.map((c) => c[4]));
const fechas = [...COMENTARIOS, ...VALORACIONES].map((x) => x[0]).sort();
const tiendas = new Set([...COMENTARIOS, ...VALORACIONES].map((x) => x[1]));
const positivos = VALORACIONES.filter((v) => v[3]).length;

const punto = (a) => `
  <article class="tarjeta punto">
    <div class="arriba">
      <div style="flex:1">
        <span class="chip" style="--c:${color(a.categoria)}">${a.categoria}</span>
        <h3>${a.sujeto}</h3>
        <div class="fechas">Del ${dia(a.fechas[0])} al ${dia(a.fechas.at(-1))}</div>
      </div>
      <div class="n">${a.menciones}<small>menciones</small></div>
    </div>
    <p class="cita">«${a.textos[0]}»</p>
    <div class="tiendas">${a.tiendas.map(([t, n]) => `
      <div class="tienda"><span>${t}</span><div class="barra"><i style="width:${(100 * n) / a.tiendas[0][1]}%"></i></div><b>${n}</b></div>`).join("")}
    </div>
    ${ACCIONES[a.sujeto] ? `<div class="accion"><span class="etiqueta">Acción propuesta</span>${ACCIONES[a.sujeto]}</div>` : ""}
  </article>`;

const tema = (t) => `
  <div class="tema"><div><b>${t.sujeto}</b><span class="chip" style="--c:${color(t.categoria)}">${t.categoria}</span><p>«${t.textos[0]}»</p></div><span>${t.menciones}</span></div>`;

const plato = (p) => {
  const motivo = Object.entries(contar(p.motivos)).sort((a, b) => b[1] - a[1])[0];
  return `<div class="plato">
    <b>${p.nombre}${motivo && p.no > 1 ? `<small>A mejorar: «${motivo[0].toLowerCase()}»</small>` : ""}</b>
    <div class="pulgar"><i style="flex:${p.si}"></i><i style="flex:${p.no}"></i></div>
    <span>👍 ${p.si} · 👎 ${p.no}</span></div>`;
};

document.getElementById("pagina").innerHTML = `
  <div class="cabecera">
    <div>
      <h1>Merche</h1>
      <h2>Informe del Jefe</h2>
      <p>Lo que los Jefes le han contado a Merche después de comprar, ordenado para Mercadona.</p>
    </div>
    <div class="meta"><b>${dia(fechas[0])} – ${dia(fechas.at(-1))} ${fechas.at(-1).slice(0, 4)}</b><span>${ZONA} · ${tiendas.size} tiendas</span><span class="etiqueta demo">Prototipo · datos simulados</span></div>
  </div>

  <div class="cifras">
    <div class="cifra verde"><span class="etiqueta">Platos de Merche</span><b>${Math.round((100 * positivos) / VALORACIONES.length)} %</b><span>de valoraciones positivas</span>
      <div class="reparto"><i style="flex:${positivos};background:var(--marca)"></i><i style="flex:${VALORACIONES.length - positivos};background:var(--mejorable)"></i></div>
      <div class="leyenda"><span>${VALORACIONES.length} valoraciones 👍/👎</span></div>
    </div>
    <div class="cifra"><span class="etiqueta">Comentarios</span><b>${COMENTARIOS.length}</b><span>sobre productos y recetas</span>
      <div class="reparto"><i style="flex:${tipos.elogio || 0};background:var(--marca)"></i><i style="flex:${tipos.sugerencia || 0};background:var(--idea)"></i><i style="flex:${tipos.queja || 0};background:var(--mejorable)"></i></div>
      <div class="leyenda"><span><i style="background:var(--marca)"></i>${tipos.elogio || 0} elogios</span><span><i style="background:var(--idea)"></i>${tipos.sugerencia || 0} ideas</span><span><i style="background:var(--mejorable)"></i>${tipos.queja || 0} a mejorar</span></div>
    </div>
    <div class="cifra verde"><span class="etiqueta">Puntos a revisar</span><b>${puntos.length}</b><span>con acción propuesta</span></div>
    <div class="cifra"><span class="etiqueta">Tiendas</span><b>${tiendas.size}</b><span>con opiniones de sus Jefes</span></div>
  </div>

  <div class="resumen">
    <div class="redactor"><div class="avatar"><svg><use href="#chef"/></svg></div><div><span class="etiqueta">Resumen del agente redactor</span><p>${RESUMEN}</p></div></div>
    <div class="tarjeta agentes"><span class="etiqueta">Cómo se ha generado</span>
      <ol>
        <li><b>1</b><div>Analista <em>· clasifica cada comentario</em></div><span class="ia">IA</span></li>
        <li><b>2</b><div>Catálogo <em>· lo enlaza a un producto</em></div></li>
        <li><b>3</b><div>Agregador <em>· cuenta por tienda y fecha</em></div></li>
        <li><b>4</b><div>Redactor <em>· resume y propone</em></div><span class="ia">IA</span></li>
      </ol>
    </div>
  </div>

  <section class="seccion">
    <h2>Puntos a revisar</h2>
    <span class="etiqueta">Temas en los que coinciden ${UMBRAL} o más Jefes</span>
    <div class="puntos">${puntos.map(punto).join("")}</div>
  </section>

  <section class="seccion dos">
    <div class="tarjeta">
      <h2>Qué más dicen los Jefes</h2>
      <span class="etiqueta">Lo que más gusta</span>
      ${gusta.map(tema).join("")}
      <span class="etiqueta">Ideas y otros comentarios</span>
      ${otros.map(tema).join("")}
    </div>
    <div class="tarjeta">
      <h2>Valoración de los platos de Merche</h2>
      ${listaPlatos.map(plato).join("")}
    </div>
  </section>

  <footer class="etiqueta">Generado por el sistema de agentes de Merche Planifica · ${COMENTARIOS.length} comentarios y ${VALORACIONES.length} valoraciones · Equipo Fuet · <a href="chat.html">Ver cómo se recogen →</a></footer>`;
</script>
</body>
</html>
